<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Registration Form</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Georgia, serif;
            line-height: 1.6;
            color: #243447;
            background: #f3f1eb;
        }

        header {
            padding: 32px 20px;
            text-align: center;
            color: white;
            background: #102a43;
            border-bottom: 4px solid #c9a86a;
        }

        h1,
        h2 {
            margin-top: 0;
        }

        h1 {
            color: #f2d492;
            letter-spacing: 1px;
        }

        h2 {
            color: #102a43;
        }

        nav a {
            margin: 0 8px;
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            color: #f2d492;
            text-decoration: underline;
        }

        main {
            width: min(800px, calc(100% - 32px));
            margin: 32px auto;
        }

        main > img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        section {
            margin-top: 24px;
            padding: 28px;
            background: white;
            border: 1px solid #d9c28c;
            border-top: 5px solid #c9a86a;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(16, 42, 67, 0.12);
        }

        form p,
        fieldset {
            margin: 18px 0;
        }

        label,
        input {
            display: block;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            margin-top: 6px;
            padding: 10px;
            border: 1px solid #a9c2ca;
            border-radius: 5px;
            font: inherit;
        }

        fieldset label,
        input[type="checkbox"] {
            display: inline-block;
            width: auto;
            margin-right: 6px;
        }

        button {
            padding: 10px 22px;
            color: white;
            background: #e36b3d;
            border: 0;
            border-radius: 5px;
            font: inherit;
            cursor: pointer;
        }

        button:hover {
            background: #c9552d;
        }

        footer {
            padding: 20px;
            text-align: center;
            color: white;
            background: #102a43;
            border-top: 3px solid #c9a86a;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Our Club</h1>
        <nav aria-label="Main navigation">
            <a href="#home">Home</a> |
            <a href="#register">Register</a> |
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main id="home">
        <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=800&q=80"
             alt="Friends enjoying time together" width="800" height="400">

        <section id="register">
            <h2>Register Now</h2>
            <form action="#" method="post">
                <p>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </p>
                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </p>
                <fieldset>
                    <legend>Membership type</legend>
                    <label>
                        <input type="radio" name="membership" value="basic" required>
                        Basic
                    </label>
                    <label>
                        <input type="radio" name="membership" value="premium">
                        Premium
                    </label>
                    <label>
                        <input type="radio" name="membership" value="family">
                        Family
                    </label>
                </fieldset>
                <p>
                    <label>
                        <input type="checkbox" name="updates">
                        Send me email updates
                    </label>
                    <label>
                        <input type="checkbox" name="events">
                        Notify me about events
                    </label>
                    <label>
                        <input type="checkbox" name="volunteer">
                        I want to volunteer
                    </label>
                </p>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer id="contact">
        <p>&copy; 2026 Our Club. All rights reserved.</p>
    </footer>
</body>
</html>
