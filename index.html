<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Registration Form</title>
<link rel="stylesheet" href="styles.css">
</head>
<body id="top">
    <header class="site-header">
        <h1 class="site-title">Welcome to Our Club</h1>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="#home">Home</a>
            <a href="#register">Register</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main id="home" class="page-main">
        <img class="hero-image" src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=800&q=80"
             alt="Friends enjoying time together" width="800" height="400">

        <section id="register" class="register-section">
            <h2 class="section-title">Register Now</h2>
            <form class="registration-form" action="#" method="post">
                <p class="form-row">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </p>
                <p class="form-row">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </p>
                <fieldset class="membership-options">
                    <legend>Membership type</legend>
                    <label class="option-label">
                        <input type="radio" name="membership" value="basic" required>
                        Basic
                    </label>
                    <label class="option-label">
                        <input type="radio" name="membership" value="premium">
                        Premium
                    </label>
                    <label class="option-label">
                        <input type="radio" name="membership" value="family">
                        Family
                    </label>
                </fieldset>
                <div class="checkbox-group">
                    <label class="option-label checkbox-label">
                        <input type="checkbox" name="updates">
                        Send me email updates
                    </label>
                    <label class="option-label checkbox-label">
                        <input type="checkbox" name="events">
                        Notify me about events
                    </label>
                    <label class="option-label checkbox-label">
                        <input type="checkbox" name="volunteer">
                        I want to volunteer
                    </label>
                </div>
                <button class="submit-btn" type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer id="contact" class="site-footer">
        <p class="copyright">&copy; 2026 Our Club. All rights reserved.</p>
    </footer>
</body>
</html>
