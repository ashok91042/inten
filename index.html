<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Registration Form</title>
</head>
<body>
    <header>
        <h1>Welcome to Our Club</h1>
        <nav aria-label="Main navigation">
            <a href="#home">Home</a> |
            <a href="#register">Register</a> |
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main id="home">
        <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=800&q=80"
             alt="Friends enjoying time together" width="800" height="400">

        <section id="register">
            <h2>Register Now</h2>
            <form action="#" method="post">
                <p>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </p>
                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </p>
                <fieldset>
                    <legend>Membership type</legend>
                    <label>
                        <input type="radio" name="membership" value="basic" required>
                        Basic
                    </label>
                </fieldset>
                <p>
                    <label>
                        <input type="checkbox" name="updates">
                        Send me email updates
                    </label>
                </p>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer id="contact">
        <p>&copy; 2026 Our Club. All rights reserved.</p>
    </footer>
</body>
</html>
